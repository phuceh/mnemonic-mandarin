<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1200" viewBox="100 0 1000 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="redGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#E34835"/>
      <stop offset="100%" stop-color="#B82218"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D28A"/>
      <stop offset="100%" stop-color="#B98A3D"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  

  <!-- Main circle -->
  <circle cx="600" cy="400" r="290" fill="url(#redGrad)" filter="url(#shadow)"/>
  <circle cx="600" cy="400" r="255" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Decorative corners -->
  <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round">
    <path d="M385 210 h25 v-25"/>
    <path d="M815 210 h-25 v-25"/>
    <path d="M385 590 h25 v25"/>
    <path d="M815 590 h-25 v25"/>
  </g>

  <!-- Chinese character -->
  <text x="600" y="470"
        text-anchor="middle"
        font-size="220"
        font-family="Noto Serif SC, SimSun, serif"
        fill="#F8F4ED"
        font-weight="bold">记</text>

  <!-- Brand name -->
  <text x="600" y="820"
        text-anchor="middle"
        font-size="92"
        font-family="Georgia, Times New Roman, serif"
        fill="#111827"
        font-weight="600">Memorize Mandarin</text>

  <!-- Tagline -->
  <line x1="250" y1="920" x2="420" y2="920" stroke="url(#goldGrad)" stroke-width="3"/>
  <line x1="780" y1="920" x2="950" y2="920" stroke="url(#goldGrad)" stroke-width="3"/>

  <text x="600" y="940"
        text-anchor="middle"
        font-size="42"
        font-family="Noto Serif SC, SimSun, serif"
        fill="#B98A3D"
        letter-spacing="8">记住中文 · 记住未来</text>
</svg>
